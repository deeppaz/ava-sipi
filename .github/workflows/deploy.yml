name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    name: Cloudflare Pages (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # secrets are not readable inside step `if:`; expose presence as an env flag
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schema:export
      - name: Build
        env:
          VITE_MANIFEST_URL: ${{ vars.VITE_MANIFEST_URL }}
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: pnpm --filter @ava-sipi/web build && pnpm budget
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=ava-sipi
      - name: Deploy to GitHub Pages (fork-friendly fallback)
        if: env.HAS_CLOUDFLARE != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist

  worker:
    name: Cloudflare Worker (edge proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.DEPLOY_WORKER == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy
          secrets: |
            USGS_API_KEY
            OPEN_METEO_API_KEY
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
