name: ingest-live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Restore artifacts published by the weekly job (station names, percentiles)
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: uv run python restore.py --out ./.out gauge-stations gauge-stats gauge-noaa
      - name: Run live pipelines (NOAA first so USGS can join flood categories)
        env:
          INGEST_PUBLISH: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          USGS_TASK: latest
        run: uv run python cli.py run gauges_noaa gauges_usgs events_gdacs --out ./.out --publish
      - name: Publish root manifest + purge cache
        if: '!cancelled()'
        env:
          INGEST_PUBLISH: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: uv run python publish.py
      - name: Commit manifests
        if: '!cancelled()'
        run: |
          git config user.name "ava-sipi-bot"
          git config user.email "bot@users.noreply.github.com"
          # Layer manifests are owned by the pipeline that wrote them and the root manifest is
          # derived, so a concurrent commit is resolved by regenerating, never by merging: take
          # main, drop this run's layer files on top, rebuild manifest.json, commit, push.
          # Only the layer files this run actually rewrote travel to main. Copying every file
          # would carry this checkout's (possibly older) copies of the other layers over newer
          # commits made while the run was going — that rolled the GRACE layer back once.
          mkdir -p /tmp/run-manifests
          for f in $(git diff --name-only -- ../data/manifests | grep -v '/manifest\.json$' || true); do
            cp "../$f" /tmp/run-manifests/ 2>/dev/null || cp "$f" /tmp/run-manifests/
          done
          ls /tmp/run-manifests
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in /tmp/run-manifests/*.json; do
              [ -e "$f" ] || continue
              cp "$f" ../data/manifests/
            done
            uv run python cli.py root
            git add ../data/manifests
            if git diff --cached --quiet; then echo "manifests unchanged"; exit 0; fi
            git commit -m "chore(ingest): live manifests $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
