name: ingest-live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Run live pipelines (NOAA first so USGS can join flood categories)
        env:
          INGEST_PUBLISH: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          USGS_TASK: latest
        run: uv run python cli.py run gauges_noaa gauges_usgs events_gdacs --out ./.out --publish
      - name: Publish root manifest + purge cache
        env:
          INGEST_PUBLISH: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: uv run python publish.py
      - name: Commit manifests
        run: |
          git config user.name "ava-sipi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ../data/manifests
          git diff --cached --quiet || git commit -m "chore(ingest): live manifests $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
