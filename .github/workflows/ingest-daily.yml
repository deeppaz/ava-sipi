name: ingest-daily

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: ingest-daily

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ingest
    env:
      INGEST_PUBLISH: 'true'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Restore river points from the latest rivers artifact
        run: uv run python restore.py --out ./.out river-points river-cells
      # drought_gdo compares the WMS TIME extent with the current manifest and exits early when unchanged (10-day cadence)
      - run: uv run python cli.py run discharge_openmeteo drought_gdo --out ./.out --publish
      - name: Publish root manifest + purge cache
        if: '!cancelled()'
        run: uv run python publish.py
      - name: Commit manifests
        if: '!cancelled()'
        run: |
          git config user.name "ava-sipi-bot"
          git config user.email "bot@users.noreply.github.com"
          # Layer manifests are owned by the pipeline that wrote them and the root manifest is
          # derived, so a concurrent commit is resolved by regenerating, never by merging: take
          # main, drop this run's layer files on top, rebuild manifest.json, commit, push.
          mkdir -p /tmp/run-manifests
          cp ../data/manifests/*.json /tmp/run-manifests/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in /tmp/run-manifests/*.json; do
              [ "$(basename "$f")" = "manifest.json" ] && continue
              cp "$f" ../data/manifests/
            done
            uv run python cli.py root
            git add ../data/manifests
            if git diff --cached --quiet; then echo "manifests unchanged"; exit 0; fi
            git commit -m "chore(ingest): daily manifests $(date -u +%Y-%m-%d)"
            git push origin HEAD:main && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
